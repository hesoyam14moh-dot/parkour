<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>باركور</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial;background:#000;touch-action:none;user-select:none}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 25% 15%, rgba(90,140,255,.42), transparent 55%),
    radial-gradient(circle at 78% 82%, rgba(90,140,255,.22), transparent 55%),
    linear-gradient(180deg,#5a2a9e 0%,#2a1060 35%,#0a0320 72%,#000 100%);
  color:#fff;z-index:100;gap:15px;padding:20px}
.btn{background:#fff;color:#2a1060;border:none;padding:16px 40px;font-size:18px;border-radius:8px;font-weight:bold;min-width:220px}
#roomInput{width:220px;padding:15px;font-size:22px;text-align:center;border-radius:8px;border:2px solid #fff;letter-spacing:6px;text-transform:uppercase;background:#0a0320;color:#fff}
#roomCode{font-size:38px;font-weight:bold;letter-spacing:8px;color:#fff;padding:12px 26px;background:rgba(255,255,255,.15);border-radius:12px}
#status{font-size:15px;color:#c8d4ff;text-align:center;min-height:20px}
#joy{position:absolute;bottom:25px;left:25px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.7);z-index:10;display:none}
#stick{position:absolute;top:50%;left:50%;width:55px;height:55px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none}
#jump{position:absolute;bottom:35px;right:35px;width:95px;height:95px;border-radius:50%;background:#fff;color:#2a1060;border:none;font-size:18px;font-weight:bold;z-index:10;display:none;align-items:center;justify-content:center}
#roomInfo{position:absolute;top:15px;left:15px;color:#fff;font-size:15px;font-weight:bold;z-index:15;display:none;text-shadow:1px 1px 3px #000}
#toast{position:absolute;top:35%;width:100%;text-align:center;color:#ffe66d;font-size:26px;font-weight:bold;text-shadow:2px 2px 5px #000;z-index:12;display:none;pointer-events:none}
#coinHud{position:absolute;top:15px;right:15px;display:none;align-items:center;gap:10px;
  background:rgba(0,0,0,.55);padding:10px 16px;border-radius:26px;z-index:15;color:#fff;font-weight:bold;font-size:20px}
#coinIcon{display:inline-flex;align-items:center;justify-content:center}
#coinIcon img{width:42px;height:42px;display:block}
#coinCount{font-size:20px}
#coinHud button{background:#fff;color:#2a1060;border:none;padding:8px 14px;border-radius:16px;font-weight:bold;font-size:14px;cursor:pointer}
#viewCodeBtn{background:transparent !important;color:#fff !important;font-size:11px !important;
  text-decoration:underline;opacity:.85;padding:2px 4px !important;border-radius:0 !important}
#redeemModal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#redeemBox{background:#1a0a3a;border:2px solid #fff;padding:26px 22px;border-radius:16px;text-align:center;color:#fff;width:100%;max-width:340px}
#redeemBox h2{font-size:20px;margin-bottom:6px}
#redeemCode{font-size:32px;font-weight:bold;letter-spacing:8px;color:#ffe66d;background:rgba(0,0,0,.4);padding:14px 10px;border-radius:10px;margin:18px 0;font-family:monospace}
#redeemBox .row{display:flex;gap:10px;justify-content:center}
#redeemBox button{border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:bold;background:#fff;color:#1a0a3a;cursor:pointer}
</style>
</head>
<body>

<div id="menu">
  <button class="btn" id="createBtn">إنشاء غرفة</button>
  <button class="btn" id="joinBtn">انضمام الغرفة</button>
  <input id="roomInput" placeholder="الرمز" maxlength="4" style="display:none"/>
  <button class="btn" id="joinOk" style="display:none">دخول</button>
  <div id="roomCode" style="display:none"></div>
  <div id="status"></div>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="jump">نط</div>
<div id="roomInfo"></div>
<div id="toast"></div>

<div id="coinHud">
  <span id="coinIcon">🪙</span>
  <span id="coinCount">0</span>
  <button id="redeemBtn">استرداد</button>
  <button id="viewCodeBtn">الكود محفوظ</button>
</div>

<div id="redeemModal">
  <div id="redeemBox">
    <h2 id="redeemTitle">كود الاسترداد</h2>
    <div id="redeemCode">-------</div>
    <div class="row">
      <button id="copyBtn">نسخ</button>
      <button id="okBtn">موافق</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.0/peerjs.min.js"></script>
<script>
var COIN_URL='https://i.postimg.cc/VvJQLGFK/IMG-20261008-153917-222.jpg';

var $=function(i){return document.getElementById(i)};
var menu=$('menu'),createBtn=$('createBtn'),joinBtn=$('joinBtn'),joinOk=$('joinOk'),
    roomInput=$('roomInput'),roomCodeDiv=$('roomCode'),statusDiv=$('status'),
    joy=$('joy'),stick=$('stick'),jumpBtn=$('jump'),roomInfoEl=$('roomInfo'),toast=$('toast'),
    coinHud=$('coinHud'),coinCountEl=$('coinCount'),coinIconEl=$('coinIcon'),
    redeemBtn=$('redeemBtn'),viewCodeBtn=$('viewCodeBtn'),redeemModal=$('redeemModal'),
    redeemCodeEl=$('redeemCode'),redeemTitle=$('redeemTitle'),copyBtn=$('copyBtn'),okBtn=$('okBtn');

coinIconEl.innerHTML='<img src="'+COIN_URL+'">';

/* ==== تخزين آمن ==== */
var MEM={};
function S(k,v){MEM[k]=String(v);try{localStorage.setItem('pk_'+k,v)}catch(e){}}
function L(k){
  try{var v=localStorage.getItem('pk_'+k);if(v!==null&&v!==undefined)return v}catch(e){}
  return MEM[k]||'';
}
function refreshCoins(){coinCountEl.textContent=L('coins')||'0'}

/* ==== حالة عامة ==== */
var peer,conn,role,roomCode,started=false,sendTimer,SEED=1;
var scene,camera,renderer,clock=new THREE.Clock();
var boxes=[],localMesh,remoteMesh,finishBox,checkpoints=[],finishShown=false;
var pos=new THREE.Vector3(),remotePos=new THREE.Vector3(),
    startPos=new THREE.Vector3(),lastSafe=new THREE.Vector3();
var yaw=0,pitch=0,remoteYaw=0,vy=0,onGround=true,curCP=-1;
var GRAV=22,JUMP=10,SPD=7.5,RAD=0.5;

function gen4(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ',s='';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function gen7(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<7;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ==== القائمة ==== */
createBtn.onclick=function(){
  role='host';roomCode=gen4();SEED=Math.floor(Math.random()*1e5)+1;
  statusDiv.textContent='جاري الإنشاء...';
  peer=new Peer('wmg-'+roomCode,{debug:0});
  peer.on('open',function(){
    roomCodeDiv.textContent=roomCode;roomCodeDiv.style.display='block';
    createBtn.style.display='none';joinBtn.style.display='none';
    statusDiv.textContent='أعط الرمز لصاحبك';
  });
  peer.on('connection',function(c){
    conn=c;
    conn.on('open',function(){conn.send({t:'i',seed:SEED});start()});
    conn.on('data',onData);
  });
  peer.on('error',function(e){statusDiv.textContent='خطأ: '+e.type});
};
joinBtn.onclick=function(){
  createBtn.style.display='none';joinBtn.style.display='none';
  roomInput.style.display='block';joinOk.style.display='block';roomInput.focus();
};
joinOk.onclick=function(){
  var c=roomInput.value.trim().toUpperCase();
  if(c.length!==4){statusDiv.textContent='يجب 4 أحرف';return}
  role='guest';roomCode=c;statusDiv.textContent='جاري الاتصال...';
  peer=new Peer({debug:0});
  peer.on('open',function(){conn=peer.connect('wmg-'+c,{reliable:true});conn.on('data',onData)});
  peer.on('error',function(e){statusDiv.textContent='خطأ: '+e.type});
};

function onData(d){
  if(!d||!d.t)return;
  if(d.t==='i'){SEED=d.seed;start();return}
  if(started&&d.t==='s'){remotePos.set(d.p[0],d.p[1],d.p[2]);remoteYaw=d.r}
}

/* ==== بدء ==== */
function start(){
  if(started)return;started=true;
  startPos.set(role==='host'?-2:2,3,28);
  pos.copy(startPos);lastSafe.copy(startPos);
  remotePos.set(role==='host'?2:-2,3,28);
  yaw=0;pitch=0;vy=0;onGround=true;curCP=-1;finishShown=false;
  menu.style.display='none';joy.style.display='block';jumpBtn.style.display='flex';
  roomInfoEl.style.display='block';roomInfoEl.textContent='الغرفة: '+roomCode;
  coinHud.style.display='flex';
  refreshCoins();
  init();controls();loop();
  sendTimer=setInterval(send,50);
}

/* ==== المشهد ==== */
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  scene.fog=new THREE.Fog(0x87ceeb,80,250);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
  renderer=new THREE.WebGLRenderer({antialias:false});
  renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1));
  buildMap();
  localMesh=mkPlayer(0x8a1a1a,0xffcc44);scene.add(localMesh);
  remoteMesh=mkPlayer(0x1a3a8a,0x00aaff);scene.add(remoteMesh);
  scene.add(camera);
}
function mkPlayer(bc,hc){
  var g=new THREE.Group();
  var b=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.6,10),new THREE.MeshBasicMaterial({color:bc}));
  b.position.y=0.8;g.add(b);
  var h=new THREE.Mesh(new THREE.SphereGeometry(0.35,10,8),new THREE.MeshBasicMaterial({color:hc}));
  h.position.y=1.85;g.add(h);
  return g;
}
function addPlat(x,z,w,d,top,col){
  var th=0.8;
  var b=new THREE.Mesh(new THREE.BoxGeometry(w,th,d),new THREE.MeshBasicMaterial({color:0x8a6a3a}));
  b.position.set(x,top-th/2,z);scene.add(b);
  var s=new THREE.Mesh(new THREE.BoxGeometry(w,0.08,d),new THREE.MeshBasicMaterial({color:col||0x4a8a3a}));
  s.position.set(x,top+0.04,z);scene.add(s);
  boxes.push({x:x,z:z,rx:w/2,rz:d/2,top:top,bot:top-th});
}
function addCP(x,z,top,col){
  var g=new THREE.Group();
  var b=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.15,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  b.position.y=top+0.1;g.add(b);
  var c=new THREE.Mesh(new THREE.ConeGeometry(0.35,1,8),new THREE.MeshBasicMaterial({color:col}));
  c.position.y=top+0.7;g.add(c);
  g.position.set(x,0,z);scene.add(g);
}
function buildMap(){
  var r=rng(SEED);
  addPlat(0,28,9,9,3,0x4a8a3a);
  var x=0,z=21,top=3,cpCols=[0x00ff00,0x00ffff,0xff00ff,0xffff00,0xff8800],cpN=0;
  for(var k=0;k<45;k++){
    z-=3+r()*1.3;
    x+=(r()*2-1)*3;if(x>22)x=22;if(x<-22)x=-22;
    top+=(r()*2-1)*1.7;if(top<2.5)top=2.5;if(top>28)top=28;
    var w=1.8+r()*1.3,d=1.8+r()*1.3,end=(k===44),cp=(!end&&k>0&&k%9===0);
    addPlat(x,z,w,d,top,end?0xffcc00:0x4a8a3a);
    if(end)finishBox=boxes[boxes.length-1];
    if(cp){
      var col=cpCols[cpN++%cpCols.length];
      addCP(x,z,top,col);
      checkpoints.push({x:x,z:z,top:top,id:checkpoints.length});
    }
  }
}

/* ==== التحكم ==== */
var mx=0,my=0,joyId=null,jcx=0,jcy=0,lookId=null,llx=0,lly=0,keys={};

function controls(){
  joy.addEventListener('touchstart',function(e){
    e.preventDefault();var t=e.changedTouches[0];joyId=t.identifier;
    var r=joy.getBoundingClientRect();jcx=r.left+r.width/2;jcy=r.top+r.height/2;
  },{passive:false});
  joy.addEventListener('touchmove',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===joyId){
        var dx=t.clientX-jcx,dy=t.clientY-jcy,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>60){dx=dx/dist*60;dy=dy/dist*60}
        stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
        mx=dx/60;my=dy/60;
      }
    }
  },{passive:false});
  function endJoy(e){
    for(var i=0;i<e.changedTouches.length;i++)
      if(e.changedTouches[i].identifier===joyId){joyId=null;mx=0;my=0;stick.style.transform='translate(-50%,-50%)'}
  }
  joy.addEventListener('touchend',endJoy);
  joy.addEventListener('touchcancel',endJoy);

  document.body.addEventListener('touchstart',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.target.closest&&(t.target.closest('#joy')||t.target.closest('#jump')||t.target.closest('#roomInfo')||t.target.closest('#coinHud')||t.target.closest('#redeemModal')))continue;
      if(t.clientX>innerWidth/2&&lookId===null){lookId=t.identifier;llx=t.clientX;lly=t.clientY}
    }
  },{passive:false});
  document.body.addEventListener('touchmove',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===lookId){
        var dx=t.clientX-llx,dy=t.clientY-lly;llx=t.clientX;lly=t.clientY;
        yaw-=dx*0.005;pitch-=dy*0.005;
        if(pitch>1)pitch=1;if(pitch<-1)pitch=-1;
      }
    }
  },{passive:false});
  document.body.addEventListener('touchend',function(e){
    for(var i=0;i<e.changedTouches.length;i++)
      if(e.changedTouches[i].identifier===lookId)lookId=null;
  });

  jumpBtn.addEventListener('touchstart',function(e){e.preventDefault();doJump()},{passive:false});
  jumpBtn.addEventListener('mousedown',function(e){e.preventDefault();doJump()});
  addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')doJump()});
  addEventListener('keyup',function(e){keys[e.code]=false});
  document.body.addEventListener('mousemove',function(e){
    if(document.pointerLockElement===document.body){
      yaw-=e.movementX*0.003;pitch-=e.movementY*0.003;
      if(pitch>1)pitch=1;if(pitch<-1)pitch=-1;
    }
  });
  renderer.domElement.addEventListener('click',function(){
    if(started&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();
  });

  redeemBtn.onclick=function(e){e.stopPropagation();openRedeem()};
  viewCodeBtn.onclick=function(e){e.stopPropagation();openSavedCode()};
  copyBtn.onclick=function(e){e.stopPropagation();doCopy()};
  okBtn.onclick=function(e){e.stopPropagation();if(okBtn._fn)okBtn._fn()};
  redeemModal.onclick=function(e){if(e.target===redeemModal)closeModal()};
}

function doJump(){if(started&&onGround){vy=JUMP;onGround=false}}

/* ==== الفيزياء ==== */
function update(dt){
  var kx=0,kz=0;
  if(keys['KeyW']||keys['ArrowUp'])kz+=1;
  if(keys['KeyS']||keys['ArrowDown'])kz-=1;
  if(keys['KeyA']||keys['ArrowLeft'])kx-=1;
  if(keys['KeyD']||keys['ArrowRight'])kx+=1;
  kx+=mx;kz-=my;
  var len=Math.sqrt(kx*kx+kz*kz);if(len>1){kx/=len;kz/=len}
  var fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  var py=pos.y;
  var nx=pos.x+(fx*kz+rx*kx)*SPD*dt,nz=pos.z+(fz*kz+rz*kx)*SPD*dt;

  for(var i=0;i<boxes.length;i++){
    var b=boxes[i];
    if(pos.y>=b.top-0.1||pos.y+1.6<=b.bot+0.05)continue;
    var dx=nx-b.x,dz=nz-b.z;
    if(Math.abs(dx)<b.rx+RAD&&Math.abs(dz)<b.rz+RAD){
      var ox=b.rx+RAD-Math.abs(dx),oz=b.rz+RAD-Math.abs(dz);
      if(ox<oz)nx+=dx>0?ox:-ox;else nz+=dz>0?oz:-oz;
    }
  }
  pos.x=nx;pos.z=nz;
  vy-=GRAV*dt;pos.y+=vy*dt;

  var landed=false;
  if(vy<=0){
    var bt=-Infinity,bb=null;
    for(var j=0;j<boxes.length;j++){
      var b2=boxes[j];
      if(Math.abs(pos.x-b2.x)<b2.rx+RAD*0.6&&Math.abs(pos.z-b2.z)<b2.rz+RAD*0.6&&
         py>=b2.top-0.05&&pos.y<=b2.top+0.05){
        if(b2.top>bt){bt=b2.top;bb=b2}
      }
    }
    if(bb){
      pos.y=bt;vy=0;onGround=true;landed=true;
      for(var c=0;c<checkpoints.length;c++){
        var cp=checkpoints[c];
        if(Math.abs(cp.x-bb.x)<0.5&&Math.abs(cp.z-bb.z)<0.5&&Math.abs(cp.top-bb.top)<0.5){
          if(cp.id>curCP){
            curCP=cp.id;lastSafe.set(cp.x,cp.top+0.05,cp.z);
            showToast('نقطة حفظ ✔');
          }
          break;
        }
      }
    }
  }
  if(!landed)onGround=false;

  if(pos.y<-25){
    pos.copy(curCP<0?startPos:lastSafe);
    vy=0;onGround=true;
  }

  /* ==== الفوز ==== */
  if(finishBox&&!finishShown){
    if(Math.abs(pos.x-finishBox.x)<finishBox.rx+0.6&&Math.abs(pos.z-finishBox.z)<finishBox.rz+0.6&&pos.y>=finishBox.top-0.3){
      finishShown=true;
      var already=L('code');
      if(!already){
        /* أول فوز: ولّد كود + 0.5 عملة، واعرضه للمستخدم فقط (بدون استرداد) */
        S('code',gen7());
        S('coins','0.5');
        S('redeemed','0');
        refreshCoins();
        showToast('لقد فزت! 🎉');
        setTimeout(function(){showModal('كود الاسترداد',L('code'),closeModal)},700);
      } else {
        showToast('لقد فزت! 🎉');
      }
    }
  }
}

function showToast(m){toast.textContent=m;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){toast.style.display='none'},1300)}
function send(){if(conn&&conn.open&&started)conn.send({t:'s',p:[pos.x,pos.y,pos.z],r:yaw})}

/* ==== النافذة ==== */
function showModal(title,code,onOk){
  redeemTitle.textContent=title;
  redeemCodeEl.textContent=code;
  redeemModal.style.display='flex';
  okBtn._fn=onOk||closeModal;
  copyBtn.focus();
}

/* زر استرداد: يفتح الكود، وعند "موافق" فقط يتم التصفير */
function openRedeem(){
  var code=L('code');
  if(!code){showToast('لم تفز بعد');return}
  if(L('redeemed')==='1'){showToast('تم الاسترداد مسبقاً');return}
  showModal('كود الاسترداد',code,function(){
    S('redeemed','1');
    S('coins','0');
    refreshCoins();
    closeModal();
    showToast('تم الاسترداد');
  });
}

/* زر الكود المحفوظ: عرض فقط، بدون أي استرداد */
function openSavedCode(){
  var code=L('code');
  if(!code){showToast('لا يوجد كود محفوظ');return}
  showModal('الكود المحفوظ',code,closeModal);
}

function doCopy(){
  var t=redeemCodeEl.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){copyBtn.textContent='تم ✔';setTimeout(function(){copyBtn.textContent='نسخ'},1200)}).catch(function(){fb(t)});
  }else fb(t);
}
function fb(t){
  var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
  document.body.appendChild(a);a.focus();a.select();
  try{document.execCommand('copy');copyBtn.textContent='تم ✔'}catch(e){copyBtn.textContent='فشل'}
  document.body.removeChild(a);setTimeout(function(){copyBtn.textContent='نسخ'},1200);
}
function closeModal(){redeemModal.style.display='none'}

/* ==== الحلقة ==== */
function loop(){
  requestAnimationFrame(loop);
  if(!started||!renderer)return;
  var dt=Math.min(clock.getDelta(),0.05);
  update(dt);
  if(localMesh){localMesh.position.copy(pos);localMesh.rotation.y=yaw+Math.PI}
  if(remoteMesh){remoteMesh.position.copy(remotePos);remoteMesh.rotation.y=remoteYaw+Math.PI}
  var D=7,e=0.45-pitch;if(e<0.12)e=0.12;if(e>1.15)e=1.15;
  camera.position.set(pos.x+Math.sin(yaw)*D*Math.cos(e),pos.y+1.4+D*Math.sin(e),pos.z+Math.cos(yaw)*D*Math.cos(e));
  camera.lookAt(pos.x,pos.y+1.3,pos.z);
  renderer.render(scene,camera);
}

addEventListener('resize',function(){
  if(!camera)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
